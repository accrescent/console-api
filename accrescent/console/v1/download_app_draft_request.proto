syntax = "proto3";

package accrescent.console.v1;

import "buf/validate/validate.proto";

option go_package = "golang.accrescent.app/genproto/accrescent/console/v1;console";
option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Request defining parameters for downloading an app draft.
message DownloadAppDraftRequest {
  // The ID of the app draft to get download info for.
  string app_draft_id = 1 [(buf.validate.field).required = true];
}
