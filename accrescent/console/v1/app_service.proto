syntax = "proto3";

package accrescent.console.v1;

import "accrescent/console/v1/get_app_request.proto";
import "accrescent/console/v1/get_app_response.proto";
import "accrescent/console/v1/list_app_listings_request.proto";
import "accrescent/console/v1/list_app_listings_response.proto";
import "accrescent/console/v1/list_apps_request.proto";
import "accrescent/console/v1/list_apps_response.proto";
import "accrescent/console/v1/update_app_request.proto";
import "accrescent/console/v1/update_app_response.proto";
import "google/api/client.proto";

option go_package = "golang.accrescent.app/genproto/accrescent/console/v1;console";
option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Service providing RPCs for managing published apps.
service AppService {
  option (google.api.default_host) = "console-api.accrescent.app";

  // Gets a published app.
  rpc GetApp(GetAppRequest) returns (GetAppResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists published apps.
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists app listings.
  rpc ListAppListings(ListAppListingsRequest) returns (ListAppListingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Updates a published app.
  rpc UpdateApp(UpdateAppRequest) returns (UpdateAppResponse) {}
}
