syntax = "proto3";

package accrescent.console.v1;

import "accrescent/console/v1/app_draft_listing_text.proto";
import "buf/validate/validate.proto";

option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Request defining parameters for creating app draft listing text.
message CreateAppDraftListingTextRequest {
  // The ID of the app draft to create listing text for.
  optional string app_draft_id = 1 [(buf.validate.field).required = true];

  // The listing text to create.
  AppDraftListingText listing_text = 2 [(buf.validate.field).required = true];
}
