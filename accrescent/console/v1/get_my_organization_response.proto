syntax = "proto3";

package accrescent.console.v1;

import "buf/validate/validate.proto";

option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Response to getting the organization owned by the currently authenticated
// user.
message GetMyOrganizationResponse {
  // The ID of the organization owned by the currently authenticated user.
  optional string organization_id = 1 [(buf.validate.field).required = true];
}
