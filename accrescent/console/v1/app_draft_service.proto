syntax = "proto3";

package accrescent.console.v1;

import "accrescent/console/v1/create_app_draft_listing_text_request.proto";
import "accrescent/console/v1/create_app_draft_listing_text_response.proto";
import "accrescent/console/v1/create_app_draft_request.proto";
import "accrescent/console/v1/create_app_draft_response.proto";
import "accrescent/console/v1/delete_app_draft_request.proto";
import "accrescent/console/v1/delete_app_draft_response.proto";
import "accrescent/console/v1/get_app_draft_details_request.proto";
import "accrescent/console/v1/get_app_draft_details_response.proto";
import "accrescent/console/v1/list_app_draft_summaries_request.proto";
import "accrescent/console/v1/list_app_draft_summaries_response.proto";
import "accrescent/console/v1/update_app_draft_listing_text_request.proto";
import "accrescent/console/v1/update_app_draft_listing_text_response.proto";

option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Service providing RPCs for managing app drafts.
service AppDraftService {
  // Creates a new app draft.
  rpc CreateAppDraft(CreateAppDraftRequest) returns (CreateAppDraftResponse) {}

  // Gets the details of an app draft to display on its corresponding page.
  rpc GetAppDraftDetails(GetAppDraftDetailsRequest) returns (GetAppDraftDetailsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates listing text for an app draft.
  rpc CreateAppDraftListingText(CreateAppDraftListingTextRequest) returns (CreateAppDraftListingTextResponse) {}

  // Updates an app draft's listing text.
  rpc UpdateAppDraftListingText(UpdateAppDraftListingTextRequest) returns (UpdateAppDraftListingTextResponse) {}

  // Lists app draft summaries for a given organization.
  //
  // App drafts are listed from newest to oldest.
  rpc ListAppDraftSummaries(ListAppDraftSummariesRequest) returns (ListAppDraftSummariesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Deletes an existing app draft.
  rpc DeleteAppDraft(DeleteAppDraftRequest) returns (DeleteAppDraftResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}
