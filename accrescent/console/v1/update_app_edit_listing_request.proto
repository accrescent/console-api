syntax = "proto3";

package accrescent.console.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

option go_package = "golang.accrescent.app/genproto/accrescent/console/v1;console";
option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Request defining parameters for updating an app edit listing.
message UpdateAppEditListingRequest {
  // The ID of the app edit listing to update.
  optional string app_edit_listing_id = 1 [(buf.validate.field).required = true];

  // The proper name of the app, possibly including very short descriptive text
  // (e.g. "SecureChat - Secure Texting").
  optional string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 30
  ];

  // A short description of the app to be shown in headers and small screen
  // spaces.
  optional string short_description = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 80
  ];

  // The list of fields to update.
  //
  // Required to enforce forward-compatible use by clients.
  google.protobuf.FieldMask update_mask = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).field_mask = {
      in: [
        "name",
        "short_description"
      ]
    }
  ];
}
