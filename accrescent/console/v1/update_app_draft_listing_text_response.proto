syntax = "proto3";

package accrescent.console.v1;

import "buf/validate/validate.proto";

option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Response to updating an app draft's listing text.
message UpdateAppDraftListingTextResponse {
  // The etag of the listing text after the update.
  optional string etag = 1 [(buf.validate.field).required = true];
}
