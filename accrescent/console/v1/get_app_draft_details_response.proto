syntax = "proto3";

package accrescent.console.v1;

import "accrescent/console/v1/app_draft_listing_text.proto";
import "buf/validate/validate.proto";

option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Response to getting app draft details.
message GetAppDraftDetailsResponse {
  // The app draft's listing text, if set.
  AppDraftListingText listing_text = 1;

  // The etag of the app draft's listing text, if set.
  optional string listing_text_etag = 2;

  option (buf.validate.message).cel = {
    id: "listing_text_etag.present_with_listing_text"
    message: "listing_text_etag must be present if and only if listing_text is present"
    expression: "has(this.listing_text) == has(this.listing_text_etag)"
  };
}
