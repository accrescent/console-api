syntax = "proto3";

package accrescent.console.v1;

import "accrescent/console/v1/app_draft_listing_text.proto";

option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Response to getting app draft details.
message GetAppDraftDetailsResponse {
  // The app draft's listing text, if set.
  AppDraftListingText listing_text = 1;
}
