syntax = "proto3";

package accrescent.console.v1;

import "buf/validate/validate.proto";

option go_package = "golang.accrescent.app/genproto/accrescent/console/v1;console";
option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Response to downloading an app edit.
message DownloadAppEditResponse {
  // The URI of the APK set which can be retrieved with a simple HTTP GET.
  optional string apk_set_uri = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true
  ];
}
