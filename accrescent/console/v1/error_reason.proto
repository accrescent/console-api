syntax = "proto3";

package accrescent.console.v1;

option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// The possible values for `google.rpc.ErrorInfo.reason` in the
// "console.accrescent.app" error domain.
enum ErrorReason {
  // The unspecified value.
  ERROR_REASON_UNSPECIFIED = 0;

  // A resource limit would be exceeded by performing the operation.
  ERROR_REASON_RESOURCE_LIMIT_EXCEEDED = 1;

  // The caller does not have sufficient permission to perform the operation.
  ERROR_REASON_INSUFFICIENT_PERMISSION = 2;

  // The provided request data is invalid.
  ERROR_REASON_INVALID_REQUEST = 3;

  // Valid authentication credentials were expected, but not provided.
  ERROR_REASON_UNAUTHENTICATED = 4;

  // The server encountered an internal error.
  ERROR_REASON_INTERNAL = 5;

  // The service is temporarily unavailable, e.g., because of maintenance or
  // overload.
  ERROR_REASON_SERVICE_UNAVAILABLE = 6;

  // The resource the caller attempted to create already exists.
  ERROR_REASON_ALREADY_EXISTS = 7;
}
