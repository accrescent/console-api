syntax = "proto3";

package accrescent.console.v1;

import "accrescent/console/v1/app_draft.proto";
import "buf/validate/validate.proto";

option go_package = "golang.accrescent.app/genproto/accrescent/console/v1;console";
option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Response to getting an app draft.
message GetAppDraftResponse {
  // The requested app draft.
  AppDraft draft = 1 [(buf.validate.field).required = true];
}
