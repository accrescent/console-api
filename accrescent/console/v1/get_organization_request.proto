syntax = "proto3";

package accrescent.console.v1;

import "buf/validate/validate.proto";

option go_package = "golang.accrescent.app/genproto/accrescent/console/v1;console";
option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Request defining parameters for getting an organization.
message GetOrganizationRequest {
  // The ID of the organization to retrieve.
  string organization_id = 1 [(buf.validate.field).required = true];
}
