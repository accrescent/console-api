syntax = "proto3";

package accrescent.console.v1;

import "buf/validate/validate.proto";

option go_package = "golang.accrescent.app/genproto/accrescent/console/v1;console";
option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Request defining parameters for creating an app listing for an app edit.
message CreateAppEditListingRequest {
  // The app edit to create the app listing for.
  optional string app_edit_id = 1 [(buf.validate.field).required = true];

  // The language of this listing's fields as a BCP-47 tag.
  optional string language = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: ["en-US"]
    }
  ];

  // The proper name of the app, possibly including very short descriptive text
  // (e.g. "SecureChat - Secure Texting").
  optional string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 30
  ];

  // A short description of the app to be shown in headers and small screen
  // spaces.
  optional string short_description = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 80
  ];
}
