syntax = "proto3";

package accrescent.console.v1;

import "accrescent/console/v1/get_organization_request.proto";
import "accrescent/console/v1/get_organization_response.proto";
import "accrescent/console/v1/list_organizations_request.proto";
import "accrescent/console/v1/list_organizations_response.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";

option go_package = "golang.accrescent.app/genproto/accrescent/console/v1;console";
option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Service providing RPCs for managing organizations.
service OrganizationService {
  option (google.api.default_host) = "console-api.accrescent.app";

  // Gets an organization.
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1alpha/organizations/{organization_id}"};
  }

  // Lists organizations.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1alpha/organizations"};
  }
}
