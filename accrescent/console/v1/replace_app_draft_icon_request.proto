syntax = "proto3";

package accrescent.console.v1;

import "buf/validate/validate.proto";

option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Request defining parameters for replacing an app draft icon.
message ReplaceAppDraftIconRequest {
  // The ID of the app draft to replace the icon of.
  optional string app_draft_id = 1 [(buf.validate.field).required = true];

  // The etag of the icon as last seen by the client.
  //
  // Required to prevent clients from accidentally overwriting concurrent
  // updates.
  optional string etag = 2 [(buf.validate.field).required = true];
}
