syntax = "proto3";

package accrescent.console.v1;

import "accrescent/console/v1/user_role.proto";
import "buf/validate/validate.proto";

option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// A console user.
message User {
  // The user's unique ID.
  optional string id = 1 [(buf.validate.field).required = true];

  // The user's roles.
  repeated UserRole roles = 2 [
    (buf.validate.field).repeated.items.enum.not_in = 0,
    (buf.validate.field).repeated.unique = true
  ];
}
