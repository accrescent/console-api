syntax = "proto3";

package accrescent.console.v1;

import "accrescent/console/v1/app_draft_listing.proto";
import "buf/validate/validate.proto";

option go_package = "golang.accrescent.app/genproto/accrescent/console/v1;console";
option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Response to listing app draft listings.
message ListAppDraftListingsResponse {
  // The app draft listings matching the request parameters.
  repeated AppDraftListing app_draft_listings = 1 [(buf.validate.field).cel = {
    id: "app_draft_listings.have_unique_languages"
    message: "app draft listings must have unique languages"
    expression: "this.map(l, l.language).unique()"
  }];

  // An opaque token which, if passed to another invocation of
  // ListAppDraftListings, will return the next page of app draft listings.
  optional string next_page_token = 2;
}
