syntax = "proto3";

package accrescent.console.v1;

import "buf/validate/validate.proto";

option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Request defining parameters for getting an app draft icon upload.
message GetAppDraftIconUploadRequest {
  // The ID of the icon upload to get.
  optional string app_draft_icon_upload_id = 1 [(buf.validate.field).required = true];
}
