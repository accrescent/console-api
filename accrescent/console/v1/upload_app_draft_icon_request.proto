syntax = "proto3";

package accrescent.console.v1;

import "buf/validate/validate.proto";

option java_multiple_files = true;
option java_package = "app.accrescent.console.v1";

// Request defining parameters for uploading an app draft icon.
message UploadAppDraftIconRequest {
  // The ID of the app draft to upload an icon for.
  optional string app_draft_id = 1 [(buf.validate.field).required = true];
}
